<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои задачи</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Мои задачи</h1>
      <div class="now" id="now"></div>
    </header>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Что нужно сделать?"
        autocomplete="off"
        required
      />
      <div class="datetime-row">
        <label for="task-deadline">Сделать до:</label>
        <input type="datetime-local" id="task-deadline" />
      </div>
      <button type="submit">Добавить</button>
    </form>

    <div class="filters">
      <button data-filter="all" class="active">Все</button>
      <button data-filter="active">Активные</button>
      <button data-filter="done">Выполненные</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <footer class="footer">
      <span id="counter">0 задач</span>
      <button id="clear-done">Удалить выполненные</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
