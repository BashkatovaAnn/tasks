<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fdf2f6" />
  <title>Мои задачи</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Шапка: заголовок и текущая дата/время -->
    <header class="header">
      <h1>Мои задачи</h1>
      <p class="now" id="now" aria-live="polite"></p>
    </header>

    <!-- Форма добавления задачи -->
    <form id="task-form" class="task-form" novalidate>
      <label class="sr-only" for="task-input">Текст задачи</label>
      <input
        type="text"
        id="task-input"
        placeholder="Что нужно сделать?"
        autocomplete="off"
        required
      />

      <div class="datetime-row">
        <label for="task-deadline">Сделать до:</label>
        <input type="datetime-local" id="task-deadline" />
      </div>

      <button type="submit" aria-label="Добавить задачу">Добавить</button>
    </form>

    <!-- Фильтры -->
    <div class="filters" role="tablist" aria-label="Фильтр задач">
      <button type="button" data-filter="all" class="active" role="tab" aria-selected="true">Все</button>
      <button type="button" data-filter="active" role="tab" aria-selected="false">Активные</button>
      <button type="button" data-filter="done" role="tab" aria-selected="false">Выполненные</button>
    </div>

    <!-- Список задач -->
    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <!-- Подвал -->
    <footer class="footer">
      <span id="counter">0 из 0 осталось</span>
      <div class="footer-actions">
        <button type="button" id="export-btn" aria-label="Скачать задачи в JSON">Скачать задачи</button>
        <label class="import-label" for="import-input" aria-label="Загрузить задачи из JSON">Загрузить задачи</label>
        <input type="file" id="import-input" accept="application/json" hidden />
        <button type="button" id="clear-done" aria-label="Удалить выполненные задачи">Удалить выполненные</button>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
